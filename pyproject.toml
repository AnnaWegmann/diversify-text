[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diversify-text"
version = "0.3.0"
description = "Generate stylistic paraphrases of texts using local transformer models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Anna Wegmann" },
    { name = "Eduardo Calò" },
    { name = "Menan Velayuthan" },
]
keywords = ["paraphrase", "nlp", "text-generation", "style-transfer", "augmentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10.0",
    "transformers>=5.5.0",
    "sentence-transformers",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "huggingface-hub",
    "tqdm>=4.67.3",
    "mutual-implication-score",
    "pysbd>=0.3.4",
    "accelerate>=1.14.0",
    "sacrebleu>=2.6.0",
    "evaluate>=0.4.6",
    "absl-py>=2.5.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
]

[project.urls]
Homepage = "https://github.com/AnnaWegmann/diversify_text"
Documentation = "https://annawegmann.github.io/diversify_text/"
Repository = "https://github.com/AnnaWegmann/diversify_text"
Issues = "https://github.com/AnnaWegmann/diversify_text/issues"

[dependency-groups]
dev = [
    "pytest",
    "pandas",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
    "myst-parser>=4.0.1",
]

[tool.hatch.build.targets.sdist]
exclude = [".github/", "docs/", "tests/", "evaluations/"]

[tool.hatch.build.targets.wheel]
packages = ["diversify_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
